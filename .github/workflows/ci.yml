name: Candidate checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-release.mjs
      - run: node --test --test-timeout=30000 plugins/whatsapp-assistant/tests/*.test.mjs
  dependencies:
    strategy:
      matrix:
        node: [22.13.0, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
        working-directory: plugins/whatsapp-assistant/runtime
        env:
          PUPPETEER_SKIP_DOWNLOAD: 1
      - run: node plugins/whatsapp-assistant/scripts/check-runtime.mjs
      - run: pnpm audit --prod
        working-directory: plugins/whatsapp-assistant/runtime
