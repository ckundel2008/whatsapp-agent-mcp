name: Candidate checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-release.mjs
      - run: node --test --test-timeout=30000 plugins/whatsapp-assistant/tests/*.test.mjs
  dependencies:
    strategy:
      matrix:
        node: [22.13.0, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
        working-directory: plugins/whatsapp-assistant/runtime
        env:
          PUPPETEER_SKIP_DOWNLOAD: 1
      - run: node plugins/whatsapp-assistant/scripts/check-runtime.mjs
      - run: pnpm audit --prod
        working-directory: plugins/whatsapp-assistant/runtime
