name: Candidate checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/whatsapp-assistant/web
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: online
      - run: npm run ui:build
      - run: git diff --exit-code -- plugins/whatsapp-assistant/web/dist/index.html plugins/whatsapp-assistant/web/licenses
      - run: npx playwright install --with-deps chromium
        working-directory: plugins/whatsapp-assistant/web
      - run: npm run ui:test
        env:
          WHATSAPP_TEST_BROWSER_CHANNEL: chromium
      - run: npm audit --omit=dev
        working-directory: plugins/whatsapp-assistant/web
  source:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-release.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/whatsapp-assistant/web
      - run: node --test --test-timeout=30000 plugins/whatsapp-assistant/tests/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: online
      - run: npm run online:test
      - run: npm run online:demo
      - run: npm audit --omit=dev
        working-directory: online
  dependencies:
    strategy:
      matrix:
        node: [22.13.0, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
        working-directory: plugins/whatsapp-assistant/runtime
        env:
          PUPPETEER_SKIP_DOWNLOAD: 1
      - run: node plugins/whatsapp-assistant/scripts/check-runtime.mjs
      - run: pnpm audit --prod
        working-directory: plugins/whatsapp-assistant/runtime
