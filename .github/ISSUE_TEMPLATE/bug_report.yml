name: Bug report
description: Report a reproducible problem using synthetic, redacted data only.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Never include real conversations, phone numbers, QR codes, capabilities, keys, or session files. Use a private reporting route for vulnerabilities."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, macOS, client, Node.js and pnpm versions (no account IDs).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal synthetic steps; do not send test messages to others.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private communications, identifiers, tokens, QR codes and session material.
          required: true
